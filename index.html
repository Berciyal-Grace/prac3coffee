<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Month Finder</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f0f4f8;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }
  .box {
    background: white;
    padding: 30px 40px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    text-align: center;
  }
  h2 {
    color: #333;
  }
  input {
    padding: 8px;
    width: 100px;
    font-size: 16px;
    text-align: center;
    border: 1px solid #ccc;
    border-radius: 5px;
  }
  button {
    padding: 8px 16px;
    margin-left: 10px;
    font-size: 16px;
    background: #4CAF50;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
  }
  button:hover {
    background: #45a049;
  }
  #result {
    margin-top: 20px;
    font-size: 20px;
    font-weight: bold;
    color: #2c3e50;
  }
</style>
</head>
<body>

<div class="box">
  <h2>Enter a number (1-12) to get the Month</h2>
  <input type="number" id="monthNumber" min="1" max="12" placeholder="e.g. 5">
  <button onclick="getMonth()">Show Month</button>
  <div id="result"></div>
</div>

<script>
function getMonth() {
  let num = parseInt(document.getElementById("monthNumber").value);
  let monthName;

  switch (num) {
    case 1:
      monthName = "January";
      break;
    case 2:
      monthName = "February";
      break;
    case 3:
      monthName = "March";
      break;
    case 4:
      monthName = "April";
      break;
    case 5:
      monthName = "May";
      break;
    case 6:
      monthName = "June";
      break;
    case 7:
      monthName = "July";
      break;
    case 8:
      monthName = "August";
      break;
    case 9:
      monthName = "September";
      break;
    case 10:
      monthName = "October";
      break;
    case 11:
      monthName = "November";
      break;
    case 12:
      monthName = "December";
      break;
    default:
      monthName = "Invalid number! Please enter 1-12.";
  }

  document.getElementById("result").innerText = monthName;
}
</script>

</body>
</html>
